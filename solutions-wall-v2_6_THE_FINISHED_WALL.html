      lasts one visit, never a stale "off"); the wall follows the site's language on arrival

      deck store the way the Watch page does, and on a tap his voice starts at once with
      the slide's picture, its title on top and his words in big letters under it; slides
      ride the take's stamps; the show ends on the doors. No Watch page, no frame. The
      decks are read ahead when the wall opens, so taps are instant. If a show can't be
      read, the card falls back to the written lines. The Studio's way back is /solutions.
      Way back: v2.4.)
     ---- v2.4 was:
     (v2.3 + all eight shows recorded by Dr. B, English and Spanish, in the slots:
      tapping a card opens the recorded show for the language on the wall. The owner
      mark is remembered: open once with ?studio and SEND TO MY STUDIO stays on in this
      browser; ?visitor turns it off. Way back: v2.3.)
     ---- v2.3 was:

      address (owner only): writes the show to localStorage 'ps-wall-show' in the Studio's
      shape and goes to /production-studio in the same tab. When a card's showUrl is
      filled, tapping the card opens the recorded show in a frame inside the wall with the
      wall's own CLOSE. Way back: v2.2.)

    } catch (e) { done(false, null); }
  }

  /* ======================= DOC B'S ROOM ======================= */
  var roomLog = [], roomBusy = false, rec = null, offered = false, remembered = false, micLive = false, micHeard = '';
  var ROOM_CAP = 12;
  function catalog() {
    var en = (lang !== 'es');
    var lines = [
      en ? 'You are Doc B, the AI of 4 LAWS Academy, standing at the Solutions wall of 4lawsacademy.com. You are talking to a visitor who is not signed in. Your job: help them find the right door and tell them plainly what it is, what it costs, and who it is for. You do not do therapy here. If they bring a life problem, you say one warm line and name ANALYZE MY SITUATION (free, one situation, right here on this site) and, for a hard or urgent case, BOOK A CALL. Never invent prices or promises. Answer in English.'
         : 'Eres Doc B, la IA de 4 LAWS Academy, parado en la pared de Soluciones de 4lawsacademy.com. Hablas con un visitante que no ha iniciado sesión. Tu trabajo: ayudarle a encontrar la puerta correcta y decirle claramente qué es, cuánto cuesta y para quién es. Aquí no haces terapia. Si trae un problema de la vida, dices una línea cálida y nombras ANALIZAR MI SITUACIÓN (gratis, una situación, aquí mismo en este sitio) y, si el caso es difícil o urgente, RESERVAR UNA LLAMADA. Nunca inventes precios ni promesas. Trata de usted, nunca de vosotros. Respond in Spanish.',
      '',
      en ? 'THIS IS THE WALL, NOT THE HOUSE. The visitor has already told you what they want. Never ask "What\'s on your mind?" or "Want to keep going?". Answer what they asked, then end on the door, in capitals. The last thing you say is the door.'
         : 'ESTO ES LA PARED, NO LA CASA. El visitante ya te dijo lo que quiere. Nunca preguntes "¿Qué tiene en mente?" ni "¿Quiere seguir?". Responde lo que preguntó y termina con la puerta, en mayúsculas. Lo último que dices es la puerta.',
      '',
      en ? 'THE WALL (eight doors):' : 'LA PARED (ocho puertas):',
      en ? '1. LIVE THE 4 LAWS (Doc B AI): the membership, the house itself. Your own Personal Work Station, My Favorite Day, a LIFE coach named Butler who knows you, the LIFE game, and Doc B in your pocket every day. A community overseen by Dr. B and run by Doc B: a safe place to grow your talents and connect with others, trust and talent. Two months free, then $29.95 a month, cancel anytime. For anyone who wants to live the 4 LAWS, not just learn them; a parent, an adult, a family. Door: BECOME A MEMBER (/sign-up). Also TAKE THE TOUR (/grand-tour) and ANALYZE MY SITUATION (free, one situation, on this site).'
         : '1. VIVE LAS 4 LEYES (Doc B AI): la membresía, la casa misma. Su propia Estación de Trabajo Personal, Mi Día Favorito, un coach llamado Butler que lo conoce, el juego LIFE, y Doc B en su bolsillo todos los días. Una comunidad supervisada por el Dr. B y manejada por Doc B: un lugar seguro para crecer en sus talentos y conectarse con otros, confianza y talento. Dos meses gratis, luego $29.95 al mes, cancela cuando quiera. Para cualquiera que quiera vivir las 4 LEYES, no solo aprenderlas; un padre, un adulto, una familia. Puerta: HACERME MIEMBRO (/sign-up). También HACER EL TOUR (/grand-tour) y ANALIZAR MI SITUACIÓN (gratis, una situación, en este sitio).',
      en ? '2. DOC B FAMILY AI: the same membership for a whole family. Each person gets a station; Doc B watches the house, tells parents when someone contributes, creates or needs something, repairs trust when it breaks. $3 a month per added family member on top of the membership. Door: BRING MY FAMILY (/sign-up).'
         : '2. DOC B FAMILY AI: la misma membresía para toda la familia. Cada uno tiene su estación; Doc B cuida la casa, avisa a los padres cuando alguien contribuye, crea o necesita algo, repara la confianza cuando se rompe. $3 al mes por cada familiar añadido, además de la membresía. Puerta: TRAER A MI FAMILIA (/sign-up).',
      en ? '3. ONLINE COURSES: learn the 4 LAWS at your own speed. Thirteen videos, worksheets, practice scenarios, role-play. Parent course and Adult course each come as Basic ($35: 14 videos, slides, worksheets) or Premium ($75: everything plus scenarios, role-play and the full practice system). Youth course ($75) for young people who want their rights. Doors: PARENT COURSE, ADULT COURSE, YOUTH COURSE.'
         : '3. CURSOS EN LÍNEA: aprenda las 4 LEYES a su ritmo. Trece videos, hojas de trabajo, escenarios de práctica, role-play. El curso para padres y el curso para adultos vienen en Básico ($35: 14 videos, diapositivas, hojas de trabajo) o Premium ($75: todo más escenarios, role-play y el sistema completo de práctica). Curso para jóvenes ($75) para jóvenes que quieren sus derechos. Puertas: CURSO PARA PADRES, CURSO PARA ADULTOS, CURSO PARA JÓVENES.',
      en ? '4. THE BOOKS (on Amazon): The 4 LAWS of Trust and Talent, $14.95, English or Spanish. Helpful Parenting (the training manual, 8 sessions), $34.95, English or Spanish (Crianza Útil). For clinicians: Treating the Disruptive Adolescent, $29.95. Door: SEE THE BOOKS.'
         : '4. LOS LIBROS (en Amazon): Las 4 LEYES de Confianza y Talento, $14.95, inglés o español. Crianza Útil (el manual de entrenamiento, 8 sesiones), $34.95, inglés o español. Para clínicos: Treating the Disruptive Adolescent, $29.95. Puerta: VER LOS LIBROS.',
      en ? '5. FREE GUIDES: three free PDFs, English and Spanish: Introduction to the 4 LAWS (15 minutes), the 4 LAWS for Kids, and First Aid for the night you need an answer now. Door: DOWNLOAD THE GUIDES.'
         : '5. GUÍAS GRATIS: tres PDF gratis, en inglés y español: Introducción a las 4 LEYES (15 minutos), las 4 LEYES para niños, y Primeros Auxilios para la noche en que necesita una respuesta ya. Puerta: DESCARGAR LAS GUÍAS.',
      en ? '6. LIVE TRAINING WITH DR. B: Dr. B trains a small group live, eight weeks, inside the LIFE game, with their real situations. Price not yet posted; the next group opens when enough people sign up. Door: SIGN ME UP (name and email), or BOOK A CALL.'
         : '6. ENTRENAMIENTO EN VIVO CON EL DR. B: el Dr. B entrena a un grupo pequeño en vivo, ocho semanas, dentro del juego LIFE, con sus situaciones reales. Precio aún no publicado; el próximo grupo abre cuando haya suficientes personas. Puerta: APÚNTEME (nombre y correo), o RESERVAR UNA LLAMADA.',
      en ? '7. COACHING & PSYCHOLOGICAL SERVICES: Dr. Eduardo Bustamante, clinical and child psychologist, 35 years, by video or phone. Coaching for hard cases, clinical and school consultation, consultation packages (hour blocks or a season of unlimited; prices on request). Door: BOOK A CALL (a consultation with Dr. B, by video or phone; you book the time on the contact page; it is not free).'
         : '7. COACHING Y SERVICIOS PSICOLÓGICOS: Dr. Eduardo Bustamante, psicólogo clínico e infantil, 35 años, por video o teléfono. Coaching para casos difíciles, consulta clínica y escolar, paquetes de consulta (bloques de horas o una temporada sin límite; precios a pedido). Puerta: RESERVAR UNA LLAMADA (una consulta con el Dr. B, por video o teléfono; usted reserva la hora en la página de contacto; no es gratis).',
      en ? '8. SELF-DIRECTED EDUCATION: not a product; a movement Dr. B believes in. Schools and centers where kids choose their learning: Lighthouse Holyoke, North Star (Sunderland MA), Bay State Learning Center (Dedham MA), Sudbury Valley School (Framingham MA), Dory Learning Center (Belfast ME), and a map to find one anywhere. Door: SEE THE SCHOOLS.'
         : '8. EDUCACIÓN AUTODIRIGIDA: no es un producto; es un movimiento en el que el Dr. B cree. Escuelas y centros donde los niños escogen lo que aprenden: Lighthouse Holyoke, North Star (Sunderland MA), Bay State Learning Center (Dedham MA), Sudbury Valley School (Framingham MA), Dory Learning Center (Belfast ME), y un mapa para encontrar uno en cualquier parte. Puerta: VER LAS ESCUELAS.',
      '',
      en ? 'THE MAP, IN DR. B\'S ORDER. Everything on the wall is the same 4 LAWS in a different form; the book is the source. For a family, or a parent with a child: the first answer is LIVE THE 4 LAWS plus DOC B FAMILY AI, two months free; the child gets a station too. A parent asking for a child takes the PARENT COURSE, not the Youth one; the YOUTH COURSE is for a young person asking for themselves. The courses are how you learn it; live training is learning it with Dr. B in the room; coaching is for the hard case. If they ask why the membership and not a course: a course teaches you the 4 LAWS once; the membership is where you live them every day, with a coach who knows you.'
         : 'EL MAPA, EN EL ORDEN DEL DR. B. Todo en la pared son las mismas 4 LEYES en otra forma; el libro es la fuente. Para una familia, o un padre con un hijo: la primera respuesta es VIVE LAS 4 LEYES más DOC B FAMILY AI, dos meses gratis; el hijo también tiene su estación. Un padre que pregunta por su hijo toma el CURSO PARA PADRES, no el de jóvenes; el CURSO PARA JÓVENES es para un joven que pregunta por sí mismo. Los cursos son para aprenderlas; el entrenamiento en vivo es aprenderlas con el Dr. B en la sala; el coaching es para el caso difícil. Si preguntan por qué la membresía y no un curso: un curso le enseña las 4 LEYES una vez; la membresía es donde las vive todos los días, con un coach que lo conoce.',
      '',
      en ? 'THE KEY QUESTIONS, one at a time, only as far as you need: Do you love reading? (the books). Do you have the time to train, and feel motivated to invest in it? (the courses, or live training). Do you want to address an issue as fast as possible? (ANALYZE MY SITUATION now; BOOK A CALL for the hard case). Do you want a place to live it, not just learn it? (the membership).'
         : 'LAS PREGUNTAS CLAVE, de una en una, solo hasta donde haga falta: ¿Le gusta leer? (los libros). ¿Tiene tiempo para entrenarse, y ganas de invertir en eso? (los cursos, o el entrenamiento en vivo). ¿Quiere resolver un asunto lo más rápido posible? (ANALIZAR MI SITUACIÓN ahora; RESERVAR UNA LLAMADA para el caso difícil). ¿Quiere un lugar donde vivirlo, no solo aprenderlo? (la membresía).',
      '',
      en ? 'THE HOUSE FACTS, for "is it safe?" and the like: Dr. Eduardo Bustamante is a licensed clinical and child psychologist, 35 years with families. What a member writes stays in the Academy\'s own records, run by Dr. B, and is not sold or shared. In a family, a child is never alone with the AI without the parents knowing; Doc B tells the parents when someone needs something. Two months free means nothing is charged until then, and you can cancel anytime. If you leave, you take the 4 LAWS with you. The AI is not counseling or treatment; for a mental health condition, see a licensed professional, and BOOK A CALL reaches Dr. B himself.'
         : 'LOS HECHOS DE LA CASA, para "¿es seguro?" y parecidos: el Dr. Eduardo Bustamante es psicólogo clínico e infantil con licencia, 35 años con familias. Lo que un miembro escribe se queda en los registros propios de la Academia, manejados por el Dr. B, y no se vende ni se comparte. En una familia, un hijo nunca está a solas con la IA sin que los padres lo sepan; Doc B avisa a los padres cuando alguien necesita algo. Dos meses gratis significa que no se cobra nada hasta entonces, y puede cancelar cuando quiera. Si se va, se lleva las 4 LEYES. La IA no es consejería ni tratamiento; para una condición de salud mental, vea a un profesional con licencia, y RESERVAR UNA LLAMADA llega al Dr. B en persona.',
      '',
      en ? 'HOW YOU ANSWER: two or three short sentences at most. Ask at most one question before naming a door. Name the door in capitals exactly as written above so the visitor can find it on the wall. If they ask what to pick, ask who it is for (themselves, a child, the whole family) and then name one door. If unsure, say so and name BOOK A CALL.'
         : 'CÓMO RESPONDES: dos o tres frases cortas como máximo. Haz como máximo una pregunta antes de nombrar una puerta. Nombra la puerta en mayúsculas tal como está escrita arriba para que el visitante la encuentre en la pared. Si preguntan qué escoger, pregunta para quién es (para ellos, para un hijo, para toda la familia) y nombra una puerta. Si no estás seguro, dilo y nombra RESERVAR UNA LLAMADA.'
    ];
    return lines.join('\n');
  }
  function bubble(who, text) {
    var d = document.createElement('div'); d.className = 'rm-b ' + who; d.textContent = text;
    $('rm-chat').appendChild(d); $('rm-chat').scrollTop = $('rm-chat').scrollHeight; return d;
  }
  function roomDoors() {
    var box = $('rm-doors'); box.innerHTML = '';
    var has = false;
    if (cur !== null) { var d = CARDS[cur][lang], i; for (i = 0; i < d.doors.length; i++) { addDoor(box, d.doors[i]); if (d.doors[i].href === LINK.docb) has = true; } }
    if (!has) addDoor(box, { t: T().analyze, href: LINK.docb, quiet: true, under: T().analyzeUnder });
  }
  function openRoom() {
    hush(); clearTimeout(timer);
    $('sw-room').className = 'on';
    $('rm-back-t').textContent = T().back;
    $('rm-sound').className = 'sw-pill' + (sound ? ' on' : '');
    roomDoors();
    if (roomLog.length === 0) {
      var hello = (cur !== null) ? T().roomHelloCard.replace('{card}', CARDS[cur][lang].title) : T().roomHello;
      bubble('docb', hello); speak(hello);
    }
    setTimeout(function () { $('rm-in').focus(); }, 80);
  }
  function closeRoom() { hush(); stopMic(); $('sw-room').className = ''; }
  function userTurns() { var n = 0, i; for (i = 0; i < roomLog.length; i++) if (roomLog[i].role === 'user') n++; return n; }
  function offerToRemember() {
    offered = true;
    var d = bubble('docb', T().offer); speak(T().offer);
    var row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px;';
    var y = document.createElement('span'); y.className = 'sh-door'; y.style.minWidth = '0'; y.textContent = T().yes;
    var n = document.createElement('span'); n.className = 'sh-door quiet'; n.style.minWidth = '0'; n.textContent = T().noThanks;
    row.appendChild(y); row.appendChild(n); $('rm-chat').appendChild(row); $('rm-chat').scrollTop = $('rm-chat').scrollHeight;
    n.onclick = function () { row.parentNode.removeChild(row); };
    y.onclick = function () {
      row.innerHTML = '';
      var lab = document.createElement('div'); lab.className = 'rm-b docb'; lab.textContent = T().askEmail; row.appendChild(lab);
      var box = document.createElement('div'); box.style.cssText = 'display:flex;gap:10px;width:100%;flex-wrap:wrap;';
      var inp = document.createElement('input'); inp.type = 'email'; inp.placeholder = T().yourEmail;
      inp.style.cssText = "flex:1 1 240px;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;padding:12px 14px;border-radius:14px;border:1px solid rgba(200,168,75,0.5);background:#0b0e12;color:#f0e6cc;outline:none;";
      var go = document.createElement('span'); go.className = 'sh-door'; go.style.minWidth = '0'; go.textContent = T().send;
      box.appendChild(inp); box.appendChild(go); row.appendChild(box); inp.focus();
      go.onclick = function () {
        var em = (inp.value || '').trim(); if (!em || em.indexOf('@') < 1) { inp.focus(); return; }
        var first = ''; var i; for (i = 0; i < roomLog.length; i++) { if (roomLog[i].role === 'user') { first = roomLog[i].content; break; } }
        go.textContent = T().thinking + '\u2026';
        post({ action: 'saveEmail', name: '[Wall] ' + first.slice(0, 80), email: em }, function (ok) {
          row.parentNode.removeChild(row);
          if (ok) {
            remembered = true;
            try { localStorage.setItem('4laws-wall-chat', JSON.stringify({ email: em, lang: lang, when: new Date().toISOString(), log: roomLog })); } catch (e) {}
            bubble('docb', T().saved); speak(T().saved);
          } else { bubble('docb', T().roomFail); }
        });
      };
    };
  }
  function roomSend() {
    var t = ($('rm-in').value || '').trim();
    if (!t || roomBusy) return;
    if (rec) stopMic();
    if (userTurns() >= ROOM_CAP) { bubble('docb', T().capLine); speak(T().capLine); $('rm-in').value = ''; return; }
    $('rm-in').value = '';
    bubble('me', t); roomLog.push({ role: 'user', content: t });
    roomBusy = true; var th = bubble('docb think', T().thinking + '…');
    post({ action: 'chat', system: catalog(), messages: roomLog.slice(-12), max_tokens: 500 }, function (ok, r) {
      roomBusy = false; th.parentNode.removeChild(th);
      var reply = (ok && r && r.reply) ? r.reply : T().roomFail;
      bubble('docb', reply); if (ok) roomLog.push({ role: 'assistant', content: reply });
      speak(reply);
      if (ok && !offered && !remembered && userTurns() >= 3) setTimeout(offerToRemember, 1200);
    });
  }
  function startMic() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert(T().speak); return; }
    try {
      rec = new SR(); rec.lang = (lang === 'es') ? 'es-US' : 'en-US'; rec.interimResults = true; rec.continuous = true;
      $('rm-mic').className = 'rm-btn live';
      micLive = true; micHeard = ($('rm-in').value || '').trim(); if (micHeard) micHeard += ' ';
      rec.onresult = function (ev) {
        var fin = '', tmp = '', i;
        for (i = ev.resultIndex; i < ev.results.length; i++) { if (ev.results[i].isFinal) fin += ev.results[i][0].transcript + ' '; else tmp += ev.results[i][0].transcript; }
        if (fin) micHeard += fin;
        $('rm-in').value = micHeard + tmp;
      };
      rec.onend = function () {
        if (micLive) { try { rec.start(); return; } catch (e) {} }
        $('rm-mic').className = 'rm-btn'; rec = null;
      };
      rec.onerror = function (ev) { if (ev && (ev.error === 'no-speech' || ev.error === 'aborted')) return; micLive = false; $('rm-mic').className = 'rm-btn'; rec = null; };
      hush(); rec.start();
    } catch (e) { $('rm-mic').className = 'rm-btn'; rec = null; }
  }
  function stopMic() { micLive = false; if (rec) { try { rec.stop(); } catch (e) {} rec = null; } $('rm-mic').className = 'rm-btn'; }
  $('rm-back').onclick = closeRoom;
  $('rm-sound').onclick = function () { toggleSound(); $('rm-sound').className = 'sw-pill' + (sound ? ' on' : ''); };
  $('rm-send').onclick = roomSend;
  $('rm-mic').onclick = function () { if (rec) { stopMic(); if (($('rm-in').value || '').trim()) roomSend(); } else startMic(); };
  $('rm-in').addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); roomSend(); } });
  function item(href, b, s, dl) {
    return '<a class="sh-item" data-out="1" href="' + href + '" target="_blank" rel="noopener"><b>' + b + '</b><span>' + s + '</span></a>';
  }
  function itemOut(href, b, s) {
    return '<a class="sh-item" data-out="1" href="' + href + '" target="_blank" rel="noopener"><b>' + b + '</b><span>' + s + '</span><i>' + ((lang === 'es') ? 'abre otro sitio' : 'opens another site') + '</i></a>';
  }
  function book(pic, name, href, btn) {
    return '<div class="sh-book"><img src="' + pic + '" alt=""><p>' + name + '</p><a class="sh-door" data-out="1" href="' + href + '" target="_blank" rel="noopener">' + btn + '</a><i style="display:block;color:#c8a84b;font-size:16px;margin-top:8px;font-style:normal">' + ((lang === 'es') ? 'abre Amazon' : 'opens Amazon') + '</i></div>';
  }

  /* ======================= LEAVING ======================= */
  var leaveHref = '';
  function leave(href) {
    leaveHref = href;
    $('lv-go').setAttribute('href', href);
    $('sw-leave').className = 'on';
  }
  $('lv-stay').onclick = function () { $('sw-leave').className = ''; };
  $('lv-go').onclick = function () { $('sw-leave').className = ''; };

  /* ======================= WIRES ======================= */
  $('sw-lang-en').onclick = function () { setLang('en'); };
  $('sw-lang-es').onclick = function () { setLang('es'); };
  $('sw-sound').onclick = toggleSound;
  $('sh-sound').onclick = toggleSound;
  $('sw-help').onclick = function () { alert(T().helpText); };
  $('sh-back').onclick = closeShow;
  $('sh-next').onclick = function () { if (!panelOpen) nextBeat(); };
  $('sh-stage').onclick = function (ev) {
    if (panelOpen) return;
    var tg = ev.target;
    if (tg && (tg.tagName === 'A' || (tg.parentNode && tg.parentNode.tagName === 'A'))) return;
    if (rec) { recToggle(); return; }
    nextBeat();
  };
  document.addEventListener('keydown', function (ev) {
    if ($('sw-room').className === 'on') { if (ev.key === 'Escape') closeRoom(); return; }
    if (cur === null) return;
    if (ev.key === 'Escape') closeShow();
    if (ev.key === 'ArrowRight' || ev.key === ' ') { if (!panelOpen) nextBeat(); }
  });

  /* ======================= GO ======================= */
  try { document.body.appendChild($('sw-show')); document.body.appendChild($('sw-room')); document.body.appendChild($('sw-leave')); } catch (e) {}
  paintBar();
  $('sw-bg').style.backgroundImage = 'url(\'' + PIC.wall + '\')';
  setTimeout(function () { $('sw-bg').className = 'sw-bg on'; $('sw-line').className = 'sw-line on'; }, 80);
  paintWall();
  prefetchDecks();
  if (synth && synth.onvoiceschanged !== undefined) { synth.onvoiceschanged = function () {}; }
})();
</script>
